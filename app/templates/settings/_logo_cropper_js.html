<script>
// ── Logo-Upload + Cropper ────────────────────────────────────────────────
// Cropper.js wird erst bei Bedarf vom CDN nachgeladen (nicht global, um andere
// Seiten nicht zu belasten). Zuschnitt + Verkleinerung passieren client-seitig;
// das Ergebnis landet als Data-URI im versteckten Feld wg_logo_data.
(function () {
  const fileInput = document.getElementById('logoFileInput');
  if (!fileInput) return;

  const CROPPER_CSS = 'https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css';
  const CROPPER_JS  = 'https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js';
  const MAX_WIDTH = 600;            // Export-Breite (Verkleinerung)
  const MAX_BYTES = 256 * 1024;     // muss zum Server-Cap passen

  let cropper = null;
  let cropperLoading = null;
  function ensureCropper() {
    if (window.Cropper) return Promise.resolve();
    if (cropperLoading) return cropperLoading;
    cropperLoading = new Promise(function (resolve, reject) {
      if (!document.querySelector('link[data-cropper]')) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = CROPPER_CSS;
        link.setAttribute('data-cropper', '1');
        document.head.appendChild(link);
      }
      const s = document.createElement('script');
      s.src = CROPPER_JS;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
    return cropperLoading;
  }

  const modalEl = document.getElementById('logoCropModal');
  const cropImg = document.getElementById('logoCropImage');
  // bootstrap erst bei Bedarf referenzieren — bei einem harten Reload laeuft
  // dieses Inline-Skript ggf. vor dem deferred Tabler/Bootstrap-Bundle.
  function getModal() {
    return modalEl ? bootstrap.Modal.getOrCreateInstance(modalEl) : null;
  }

  fileInput.addEventListener('change', function () {
    const file = this.files && this.files[0];
    if (!file) return;
    if (!/^image\/(png|jpe?g|webp)$/.test(file.type)) {
      alert('Bitte ein PNG-, JPEG- oder WebP-Bild wählen.');
      this.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = function (e) {
      ensureCropper().then(function () {
        cropImg.src = e.target.result;
        getModal().show();
      }).catch(function () {
        alert('Bildbearbeitung konnte nicht geladen werden (keine Internetverbindung?).');
      });
    };
    reader.readAsDataURL(file);
  });

  if (modalEl) {
    // Cropper erst initialisieren, wenn das Modal sichtbar ist (Container braucht
    // Dimensionen, sonst startet Cropper mit 0×0).
    modalEl.addEventListener('shown.bs.modal', function () {
      if (cropper) { cropper.destroy(); cropper = null; }
      cropper = new Cropper(cropImg, { viewMode: 1, autoCropArea: 1, background: false });
    });
    modalEl.addEventListener('hidden.bs.modal', function () {
      if (cropper) { cropper.destroy(); cropper = null; }
      fileInput.value = '';
    });
  }

  const applyBtn = document.getElementById('logoCropApply');
  if (applyBtn) {
    applyBtn.addEventListener('click', function () {
      if (!cropper) return;
      const canvas = cropper.getCroppedCanvas({ maxWidth: MAX_WIDTH, imageSmoothingQuality: 'high' });
      if (!canvas) return;
      // PNG bevorzugen; bei zu grossem Resultat (fotografische Logos) auf JPEG ausweichen.
      let dataUrl = canvas.toDataURL('image/png');
      if (dataUrl.length * 0.75 > MAX_BYTES) {
        dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      }
      document.getElementById('logoDataInput').value = dataUrl;
      document.getElementById('logoPreview').src = dataUrl;
      document.getElementById('logoPreviewWrap').classList.remove('d-none');
      // Neues Logo gewinnt: ein evtl. gesetztes "entfernen" zuruecksetzen.
      const rm = document.querySelector('[name=wg_logo_remove]');
      if (rm) rm.checked = false;
      getModal().hide();
    });
  }
})();
</script>
